<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Staff - Ream Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-lg text-sm tracking-wider">REAM MATRIX</div>
            <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold">School Admin Portal</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="{{ url_for('school_admin.manage_staff') }}" class="text-sm text-indigo-400 hover:text-indigo-300 transition">← Back to Staff Directory</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 py-12">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
            <h1 class="text-xl font-black text-white tracking-tight mb-2">Edit Staff Member</h1>
            <p class="text-xs text-slate-400 mb-6">Update credentials or role permissions for <strong class="text-indigo-300">{{ staff.username }}</strong>.</p>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" name="username" value="{{ staff.username }}" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email / Contact</label>
                    <input type="email" name="email" value="{{ staff.email or '' }}" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Role / Designation</label>
                    <select name="role" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                        <option value="ream_collection" {% if staff.role == 'ream_collection' %}selected{% endif %}>Ream Collection Officer</option>
                        <option value="school_admin" {% if staff.role == 'school_admin' %}selected{% endif %}>School Administrator</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">New Password <span class="text-slate-500 font-normal lowercase">(leave blank to keep current)</span></label>
                    <input type="password" name="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="pt-4 flex items-center justify-end space-x-3">
                    <a href="{{ url_for('school_admin.manage_staff') }}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition">Cancel</a>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl transition shadow-lg shadow-indigo-600/20">Save Changes</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
