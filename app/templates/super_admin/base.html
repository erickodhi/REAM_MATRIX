<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Super Admin - Ream Matrix{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-indigo-400">REAM MATRIX // SUPER ADMIN</h1>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-slate-400">Logged in as: <strong class="text-white">{{ current_user.username }}</strong></span>
            <a href="{{ url_for('auth.logout') }}" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-medium rounded-lg transition">Logout</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-6 p-4 rounded-lg text-sm {% if category == 'danger' %}bg-red-900/50 border border-red-500 text-red-200{% elif category == 'success' %}bg-emerald-900/50 border border-emerald-500 text-emerald-200{% else %}bg-sky-900/50 border border-sky-500 text-sky-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
