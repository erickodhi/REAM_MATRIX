<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Ream Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-lg border border-slate-700">
        <div class="mb-6">
            <a href="{{ url_for('school_admin.dashboard') }}" class="text-indigo-400 hover:underline text-sm font-medium">&larr; Back to Dashboard</a>
            <h1 class="text-2xl font-bold text-white mt-2">Edit Student Record</h1>
            <p class="text-slate-400 text-sm">Update information for {{ student.full_name }} (Adm: {{ student.admission_no }}).</p>
        </div>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Admission Number</label>
                <input type="text" name="admission_no" value="{{ student.admission_no }}" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Full Name</label>
                <input type="text" name="full_name" value="{{ student.full_name }}" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Gender</label>
                    <select name="gender" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Account Owed</label>
                    <input type="number" step="0.01" name="account_owed" value="{{ student.account_owed }}" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 font-mono">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Form / Grade</label>
                    <select name="form_grade" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                        {% for form in forms %}
                            <option value="{{ form.name }}" {% if student.form_grade == form.name %}selected{% endif %}>{{ form.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Stream</label>
                    <select name="stream" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                        {% for stream in streams %}
                            <option value="{{ stream.name }}" {% if student.stream == stream.name %}selected{% endif %}>{{ stream.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg transition duration-200 mt-4">
                Save Changes
            </button>
        </form>
    </div>
</body>
</html>
