<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended - Ream Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md text-center border border-red-500/30">
        <div class="text-red-500 text-5xl mb-4">⚠️</div>
        <h1 class="text-2xl font-bold text-white mb-2">Account Suspended</h1>
        <p class="text-slate-400 text-sm mb-6">Your school's account has been suspended due to pending subscription or license payment. Please contact the platform administrator to restore service.</p>
        <a href="{{ url_for('auth.logout') }}" class="inline-block px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-lg transition duration-200">
            Sign Out
        </a>
    </div>
</body>
</html>
