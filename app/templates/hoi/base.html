<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HOI Portal - Ream Matrix{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 hidden md:flex">
        <div>
            <div class="p-6 border-b border-slate-800">
                <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-lg text-sm tracking-wider inline-block">REAM MATRIX</div>
                <div class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-2">Principal / HOI Portal</div>
            </div>
            <nav class="p-4 space-y-1.5">
                <a href="{{ url_for('hoi.dashboard') }}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition {% if request.endpoint == 'hoi.dashboard' %}bg-indigo-600 text-white shadow-lg shadow-indigo-600/20{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                    <span>📊</span>
                    <span>Executive Dashboard</span>
                </a>
                <a href="{{ url_for('hoi.analysis') }}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition {% if request.endpoint == 'hoi.analysis' %}bg-indigo-600 text-white shadow-lg shadow-indigo-600/20{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                    <span>📈</span>
                    <span>Form & Stream Analysis</span>
                </a>
                <a href="{{ url_for('hoi.compliance_report') }}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition {% if request.endpoint == 'hoi.compliance_report' %}bg-indigo-600 text-white shadow-lg shadow-indigo-600/20{% else %}text-slate-400 hover:bg-slate-800 hover:text-white{% endif %}">
                    <span>📋</span>
                    <span>Compliance Report</span>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <div class="text-xs text-slate-300 font-medium px-4 py-2 bg-slate-950 rounded-xl mb-2">
                Logged in as <br><strong class="text-white">{{ current_user.username }}</strong>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="w-full flex items-center justify-center px-4 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white text-xs font-semibold rounded-xl transition">Logout</a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex justify-between items-center md:hidden">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-lg text-xs">REAM MATRIX HOI</div>
            <a href="{{ url_for('auth.logout') }}" class="text-xs text-rose-400 font-semibold">Logout</a>
        </header>

        <main class="flex-1 p-8 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
